<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Körfez Aqua - Fotoğrafınız Hazır</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at top, #0f2744, #050d1a);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .card {
      background: rgba(11, 23, 42, 0.85);
      border: 1px solid #1e3a5f;
      padding: 25px;
      border-radius: 20px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    h1 { font-size: 26px; color: #48CAE4; margin-bottom: 5px; }
    p { font-size: 14px; color: #90E0EF; margin-bottom: 20px; }
    .img-container {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 20px;
      background: #000;
    }
    img { width: 100%; height: auto; display: block; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      background: #0077b6;
      color: #fff;
      text-decoration: none;
      font-size: 16px;
      font-weight: bold;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .btn:hover { background: #0096c7; }
    .error { color: #ff6b6b; font-size: 15px; margin: 20px 0; }
  </style>
</head>
<body>

  <div class="card">
    <h1>KÖRFEZ AQUA</h1>
    <p>Hatıra Fotoğrafınız Hazır!</p>
    
    <div id="content">
      <div class="img-container">
        <img id="photo" src="" alt="Yükleniyor...">
      </div>
      <a id="downloadBtn" href="" download="KorfezAquaHatira.jpg" class="btn">Fotoğrafı İndir</a>
    </div>

    <div id="errorMsg" class="error" style="display:none;">Geçersiz veya süresi dolmuş fotoğraf bağlantısı.</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const imgUrl = params.get('img');

    if (imgUrl) {
      document.getElementById('photo').src = decodeURIComponent(imgUrl);
      document.getElementById('downloadBtn').href = decodeURIComponent(imgUrl);
    } else {
      document.getElementById('content').style.display = 'none';
      document.getElementById('errorMsg').style.display = 'block';
    }
  </script>
</body>
</html>
