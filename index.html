<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Körfez Aqua - Hatıra Fotoğrafınız</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        body { 
            background: linear-gradient(180deg, #07152b 0%, #030a16 100%);
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            padding: 20px; 
            text-align: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- AKVARYUM BALIKLARI & KABARCIKLAR --- */
        .sea-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        /* Balık Genel Stili */
        .fish {
            position: absolute;
            width: 55px;
            height: 35px;
        }
        .fish svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 1. Turuncu Balık (Soldan Sağa) */
        .fish-1 {
            top: 15%;
            animation: swimRight 12s linear infinite;
        }

        /* 2. Yeşil Balık (Sağdan Sola) */
        .fish-2 {
            top: 60%;
            animation: swimLeft 15s linear infinite 2s;
        }

        /* 3. Sarı Balık (Soldan Sağa) */
        .fish-3 {
            top: 80%;
            width: 42px;
            height: 28px;
            animation: swimRight 18s linear infinite 5s;
        }

        @keyframes swimRight {
            0% { transform: translateX(-80px) scaleX(1); }
            50% { transform: translateX(50vw) translateY(15px) scaleX(1); }
            100% { transform: translateX(calc(100vw + 80px)) translateY(-10px) scaleX(1); }
        }

        @keyframes swimLeft {
            0% { transform: translateX(calc(100vw + 80px)) scaleX(-1); }
            50% { transform: translateX(50vw) translateY(-15px) scaleX(-1); }
            100% { transform: translateX(-80px) translateY(10px) scaleX(-1); }
        }

        /* Kabarcıklar */
        .bubble {
            position: absolute;
            bottom: -30px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            animation: bubbleUp 7s infinite ease-in;
        }
        .b1 { left: 12%; width: 14px; height: 14px; animation-duration: 6s; }
        .b2 { left: 28%; width: 22px; height: 22px; animation-duration: 9s; animation-delay: 2s; }
        .b3 { left: 68%; width: 16px; height: 16px; animation-duration: 7.5s; animation-delay: 1s; }
        .b4 { left: 88%; width: 10px; height: 10px; animation-duration: 5.5s; animation-delay: 3s; }

        @keyframes bubbleUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
        }

        /* --- KART VE İÇERİK --- */
        .content-wrap { 
            position: relative; 
            z-index: 10; 
            width: 100%; 
            max-width: 420px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .logo-box { margin-top: 10px; margin-bottom: 15px; }
        .logo-box img { max-width: 220px; height: auto; display: block; margin: 0 auto; filter: drop-shadow(0 4px 10px rgba(0, 210, 255, 0.2)); }
        
        .card { 
            background: rgba(18, 30, 52, 0.88); 
            backdrop-filter: blur(10px);
            border-radius: 18px; 
            padding: 16px; 
            width: 100%; 
            box-shadow: 0 12px 35px rgba(0,0,0,0.6); 
            border: 1px solid rgba(0, 210, 255, 0.25); 
        }

        .img-container { width: 100%; border-radius: 12px; overflow: hidden; background: #060e1a; min-height: 250px; display: flex; align-items: center; justify-content: center; position: relative; }
        .img-container img { width: 100%; height: auto; display: block; border-radius: 12px; }
        .loading { font-size: 14px; color: #00d2ff; }
        
        .btn-indir { 
            display: block; 
            width: 100%; 
            margin-top: 18px; 
            padding: 14px; 
            background: linear-gradient(135deg, #00d2ff, #0066eb); 
            color: white; 
            text-decoration: none; 
            font-size: 15px; 
            font-weight: bold; 
            border-radius: 12px; 
            cursor: pointer; 
            border: none; 
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.35);
        }
        .btn-indir:active { transform: scale(0.98); }
        
        .kvkk-info { margin-top: 14px; font-size: 11px; color: #ffbe76; line-height: 1.4; }
        .footer { margin-top: auto; padding-top: 25px; font-size: 12px; color: #6282a5; z-index: 10; }
    </style>
</head>
<body>

    <!-- YÜZEN BALIKLAR VE KABARCIKLAR -->
    <div class="sea-container">
        <!-- Turuncu Balık -->
        <div class="fish fish-1">
            <svg viewBox="0 0 100 60">
                <path d="M70 30C70 42 50 50 25 50C18 50 10 46 0 40C8 35 10 30 10 30C10 30 8 25 0 20C10 14 18 10 25 10C50 10 70 18 70 30Z" fill="#ff793f"/>
                <polygon points="65,30 95,12 88,30 95,48" fill="#ff5252"/>
                <circle cx="24" cy="23" r="3" fill="#ffffff"/>
                <circle cx="23" cy="23" r="1.5" fill="#1e272e"/>
            </svg>
        </div>

        <!-- Yeşil Balık -->
        <div class="fish fish-2">
            <svg viewBox="0 0 100 60">
                <path d="M70 30C70 42 50 50 25 50C18 50 10 46 0 40C8 35 10 30 10 30C10 30 8 25 0 20C10 14 18 10 25 10C50 10 70 18 70 30Z" fill="#2ed573"/>
                <polygon points="65,30 95,12 88,30 95,48" fill="#10ac84"/>
                <circle cx="24" cy="23" r="3" fill="#ffffff"/>
                <circle cx="23" cy="23" r="1.5" fill="#1e272e"/>
            </svg>
        </div>

        <!-- Sarı Balık -->
        <div class="fish fish-3">
            <svg viewBox="0 0 100 60">
                <path d="M70 30C70 42 50 50 25 50C18 50 10 46 0 40C8 35 10 30 10 30C10 30 8 25 0 20C10 14 18 10 25 10C50 10 70 18 70 30Z" fill="#fed330"/>
                <polygon points="65,30 95,12 88,30 95,48" fill="#fa8231"/>
                <circle cx="24" cy="23" r="3" fill="#ffffff"/>
                <circle cx="23" cy="23" r="1.5" fill="#1e272e"/>
            </svg>
        </div>

        <!-- Kabarcıklar -->
        <div class="bubble b1"></div>
        <div class="bubble b2"></div>
        <div class="bubble b3"></div>
        <div class="bubble b4"></div>
    </div>

    <!-- ANA İÇERİK -->
    <div class="content-wrap">
        <div class="logo-box">
            <img src="https://raw.githubusercontent.com/KorfezAquaFoto/korfez-aqua-foto/main/logo.png" alt="Körfez Aqua Logo" onerror="this.style.display='none'">
        </div>

        <div class="card">
            <div class="img-container" id="imgBox">
                <span class="loading" id="durumYazisi">Fotoğrafınız hazırlanıyor...</span>
                <img id="fotoGorsel" src="" style="display: none;" alt="Hatıra Fotoğrafı">
            </div>
            
            <button id="indirBtn" class="btn-indir" style="display: none;">Fotoğrafınızı İndirmek İçin Tıklayın</button>

            <div class="kvkk-info">
                🔒 KVKK ve veri güvenliği gereği fotoğrafınız 1 saat sonra sistemden kalıcı olarak silinecektir.
            </div>
        </div>

        <div class="footer">
            Körfez Aqua - Kıtalar Akvaryumu
        </div>
    </div>

    <script>
        const SUPABASE_STORAGE_URL = "https://rbizktumazoxkiklyenv.supabase.co/storage/v1/object/public/fotolar/";
        const urlParams = new URLSearchParams(window.location.search);
        const fotoAdi = urlParams.get('foto');

        const gorsel = document.getElementById('fotoGorsel');
        const durum = document.getElementById('durumYazisi');
        const indirBtn = document.getElementById('indirBtn');

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        if (fotoAdi) {
            const tamFotoUrl = SUPABASE_STORAGE_URL + fotoAdi;

            gorsel.src = tamFotoUrl;
            gorsel.onload = function() {
                durum.style.display = "none";
                gorsel.style.display = "block";
                indirBtn.style.display = "block";
            };
            gorsel.onerror = function() {
                durum.innerText = "Fotoğraf süresi (1 saat) dolduğu için silinmiş veya link geçersiz.";
            };

            indirBtn.addEventListener('click', async function() {
                indirBtn.innerText = "İndiriliyor...";
                
                try {
                    const response = await fetch(tamFotoUrl);
                    const blob = await response.blob();

                    if (isIOS) {
                        const file = new File([blob], 'korfez_aqua_hatira.jpg', { type: 'image/jpeg' });
                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            await navigator.share({
                                files: [file],
                                title: 'Körfez Aqua Hatıra Fotoğrafı'
                            });
                            indirBtn.innerText = "Fotoğrafınızı İndirmek İçin Tıklayın";
                            return;
                        }
                    }

                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = blobUrl;
                    a.download = 'korfez_aqua_hatira.jpg';
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(blobUrl);
                    a.remove();

                    indirBtn.innerText = "Fotoğraf İndirildi ✓";
                    setTimeout(() => { indirBtn.innerText = "Fotoğrafınızı İndirmek İçin Tıklayın"; }, 2500);

                } catch (e) {
                    window.location.href = tamFotoUrl;
                    indirBtn.innerText = "Fotoğrafınızı İndirmek İçin Tıklayın";
                }
            });

        } else {
            durum.innerText = "Geçersiz fotoğraf bağlantısı.";
        }
    </script>
</body>
</html>
