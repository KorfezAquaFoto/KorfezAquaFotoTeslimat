<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akvaryum Hatırası - Fotoğraf İndir</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030a16;
      color: #ffffff;
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Arka Plan Canvas (Bulutsu Dalgalar & Balıklar) */
    #aquariumCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* Ana Konteyner */
    .container {
      position: relative;
      z-index: 10;
      width: 92%;
      max-width: 460px;
      padding: 24px 20px;
      margin: 20px auto;
      background: rgba(8, 24, 48, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(64, 224, 208, 0.25);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                  0 0 40px rgba(0, 195, 255, 0.15);
      text-align: center;
    }

    /* Başlık */
    .brand-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #00f2fe, #4facfe, #00c9ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 18px;
    }

    /* Fotoğraf Çerçevesi */
    .photo-wrapper {
      position: relative;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.4);
      border: 2px solid rgba(0, 242, 254, 0.4);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      min-height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .photo-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.3s ease;
    }

    /* Yükleniyor Animasyonu */
    .loader {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid #00f2fe;
      border-radius: 50%;
      width: 38px;
      height: 38px;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 1 Saatlik Silinme Uyarısı */
    .timer-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 16px;
      padding: 6px 14px;
      background: rgba(255, 75, 75, 0.15);
      border: 1px solid rgba(255, 75, 75, 0.35);
      border-radius: 20px;
      font-size: 0.78rem;
      color: #ff9b9b;
      font-weight: 500;
    }

    .timer-badge span.pulse-dot {
      width: 7px;
      height: 7px;
      background-color: #ff4b4b;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }

    /* İndir Butonu */
    .download-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 15px;
      margin-top: 18px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      color: #031427;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4);
      transition: all 0.2s ease;
    }

    .download-btn:active {
      transform: scale(0.97);
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
    }
  </style>
</head>
<body>

  <!-- Efekt Katmanı (Bulutsu Işıklar, Dalgalar ve Yüzen Balıklar) -->
  <canvas id="aquariumCanvas"></canvas>

  <div class="container">
    <div class="brand-title">DENİZ DÜNYASI MACERASI</div>
    <div class="brand-subtitle">Özel Anı Fotoğrafınız</div>

    <div class="photo-wrapper" id="photoContainer">
      <div class="loader" id="loader"></div>
      <img id="userPhoto" style="display: none;" alt="Fotoğrafınız" />
    </div>

    <div class="timer-badge">
      <span class="pulse-dot"></span>
      <span>Fotoğrafınız <strong>1 saat</strong> sonra silinecektir</span>
    </div>

    <a href="#" id="downloadLink" class="download-btn" download="akvaryum_hatira.jpg">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Fotoğrafı İndir (HD)
    </a>
  </div>

  <script>
    // 1. URL'DEN FOTOĞRAFI YÜKLEME (Örn: index.html?id=foto_123.jpg)
    const urlParams = new URLSearchParams(window.location.search);
    const photoId = urlParams.get('id') || 'sample.jpg'; // Parametre yoksa örnek dosya
    
    const photoImg = document.getElementById('userPhoto');
    const downloadBtn = document.getElementById('downloadLink');
    const loader = document.getElementById('loader');

    // Görsel yolu (Repo içindeki fotoğraflar klasörü)
    const photoUrl = 'photos/' + photoId;
    photoImg.src = photoUrl;
    downloadBtn.href = photoUrl;

    photoImg.onload = function() {
      loader.style.display = 'none';
      photoImg.style.display = 'block';
    };

    // 2. CANVAS ANİMASYONU (BULUTSU DALGALAR, IŞIKLAR, BALIKLAR, KABARCIKLAR)
    const canvas = document.getElementById('aquariumCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Renkli Tropikal Balık Nesneleri
    const fishes = [
      { x: -50, y: height * 0.25, speed: 1.2, size: 28, color: '#ff6b35', finColor: '#ffffff', waveOffset: 0 },
      { x: -80, y: height * 0.45, speed: 0.8, size: 22, color: '#ffd166', finColor: '#06d6a0', waveOffset: 2 },
      { x: width + 50, y: height * 0.7, speed: -1.0, size: 26, color: '#00b4d8', finColor: '#90e0ef', waveOffset: 4 },
      { x: -100, y: height * 0.82, speed: 1.4, size: 20, color: '#ff007f', finColor: '#7209b7', waveOffset: 1 }
    ];

    // Yükselen Kabarcıklar
    const bubbles = Array.from({ length: 18 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 4 + 2,
      speed: Math.random() * 1 + 0.6,
      wobble: Math.random() * Math.PI * 2
    }));

    let waveTick = 0;

    function drawFish(f) {
      ctx.save();
      ctx.translate(f.x, f.y + Math.sin(waveTick + f.waveOffset) * 12);
      if (f.speed < 0) ctx.scale(-1, 1); // Ters yöne yüzüyorsa aynala

      const s = f.size;

      // Gövde
      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, s, s * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();

      // Kuyruk
      ctx.fillStyle = f.finColor;
      ctx.beginPath();
      ctx.moveTo(-s * 0.8, 0);
      ctx.lineTo(-s * 1.4, -s * 0.45);
      ctx.lineTo(-s * 1.4, s * 0.45);
      ctx.closePath();
      ctx.fill();

      // Sırt Yüzgeci
      ctx.beginPath();
      ctx.moveTo(-s * 0.2, -s * 0.5);
      ctx.quadraticCurveTo(0, -s * 0.9, s * 0.3, -s * 0.4);
      ctx.fill();

      // Göz
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s * 0.5, -s * 0.1, s * 0.16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(s * 0.54, -s * 0.1, s * 0.08, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      waveTick += 0.025;

      // 1. Bulutsu Okyanus Işık Dalgaları (Nebula Glows)
      const grad1 = ctx.createRadialGradient(
        width * 0.2 + Math.sin(waveTick * 0.5) * 80, height * 0.3, 10,
        width * 0.2, height * 0.3, width * 0.8
      );
      grad1.addColorStop(0, 'rgba(0, 242, 254, 0.18)');
      grad1.addColorStop(1, 'rgba(3, 10, 22, 0)');
      ctx.fillStyle = grad1;
      ctx.fillRect(0, 0, width, height);

      const grad2 = ctx.createRadialGradient(
        width * 0.8 + Math.cos(waveTick * 0.4) * 60, height * 0.75, 10,
        width * 0.8, height * 0.75, width * 0.7
      );
      grad2.addColorStop(0, 'rgba(114, 9, 183, 0.15)');
      grad2.addColorStop(1, 'rgba(3, 10, 22, 0)');
      ctx.fillStyle = grad2;
      ctx.fillRect(0, 0, width, height);

      // 2. Kabarcıkları Çiz
      ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
      bubbles.forEach(b => {
        b.y -= b.speed;
        b.wobble += 0.03;
        const currentX = b.x + Math.sin(b.wobble) * 8;
        if (b.y < -10) { b.y = height + 10; b.x = Math.random() * width; }

        ctx.beginPath();
        ctx.arc(currentX, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      });

      // 3. Balıkları Yürüt & Çiz
      fishes.forEach(f => {
        f.x += f.speed;
        if (f.speed > 0 && f.x > width + 100) f.x = -80;
        if (f.speed < 0 && f.x < -100) f.x = width + 80;
        drawFish(f);
      });

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
